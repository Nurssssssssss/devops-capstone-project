# Tekton CD pipeline: clone the repository and roll out the pre-built image.
# Clone and deploy run as sequential steps in one TaskRun so an ephemeral
# workspace can be used without a persistent volume.
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: repo-url
      type: string
    - name: branch
      type: string
      default: main
    - name: image
      type: string
      description: Image name and tag already available to the Kubernetes cluster
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: clone-and-deploy
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: branch
          value: $(params.branch)
        - name: image
          value: $(params.image)
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskSpec:
        params:
          - name: repo-url
            type: string
          - name: branch
            type: string
          - name: image
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: alpine/git:2.45.2
            script: |
              set -eu
              git clone --depth 1 --branch "$(params.branch)" "$(params.repo-url)" "$(workspaces.source.path)/source"
          - name: deploy
            image: bitnami/kubectl:1.29
            workingDir: $(workspaces.source.path)/source
            script: |
              set -eu
              kubectl apply -f kubernetes/deployment.yaml
              kubectl set image deployment/accounts accounts="$(params.image)"
              kubectl rollout status deployment/accounts --timeout=180s
