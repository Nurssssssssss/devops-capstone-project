name: CI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint code
        run: flake8 service/routes.py service/__init__.py --count --statistics
      - name: Run unit tests
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          PYTHONPATH="$PWD" nosetests -v --with-spec --spec-color 2>&1 | tee security-headers-done
      - name: Start service and capture REST evidence
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres
          API_URL: http://localhost:8080
        run: |
          nohup gunicorn --bind 0.0.0.0:8080 wsgi:app > /tmp/accounts-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/ > kube-app-output
          bash scripts/capture-rest-evidence.sh
      - name: Build Docker image and capture image metadata
        run: |
          docker build -t accounts:1 .
          docker image ls --no-trunc accounts:1 > kube-images
      - name: Upload assessment evidence
        uses: actions/upload-artifact@v4
        with:
          name: accounts-capstone-evidence
          if-no-files-found: error
          path: |
            rest-create-done
            rest-list-done
            rest-read-done
            rest-update-done
            rest-delete-done
            security-headers-done
            kube-app-output
            kube-images
