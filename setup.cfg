[nosetests]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
skip_covered = True

[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,.venv
per-file-ignores =
    */__init__.py: F401,E402

[pylint.'MESSAGES CONTROL']
disable = E1101,C0114
